on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build vue app
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: true # Disable automatic npm caching if not required
      - run: npm ci
      - run: npm build-only